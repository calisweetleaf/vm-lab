name: Repository Integrity

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Living repository and v0.1 boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Verify living repository contracts
        run: python scripts/verify_repository.py

      - name: Run promoted v0.1 integration proof
        env:
          PYTHONPATH: src
        run: python test/vm_lab/smoke.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-lab-proof-${{ github.run_id }}
          path: |
            SOTA_RUN.md
            test/vm_lab/runs/
          if-no-files-found: error
          retention-days: 14
