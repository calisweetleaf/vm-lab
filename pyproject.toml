[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "somnus-vm-lab"
version = "0.1.0"
description = "Contract-first Somnus VM planning, authenticated daemon, verified storage, and guest bootstrap"
requires-python = ">=3.12"
dependencies = [
    "aiofiles",
    "aiohttp",
    "aiosqlite",
    "backend",
    "beautifulsoup4",
    "Bio",
    "cfgrib",
    "chardet",
    "chromadb",
    "core",
    "cryptography",
    "docker",
    "dpkt",
    "ezdxf",
    "ffmpeg",
    "fhir",
    "fiona",
    "flask",
    "flask_socketio",
    "gemmi",
    "gitpython",
    "h5py",
    "hl7apy",
    "httpx",
    "ifcopenshell",
    "librosa",
    "mne",
    "mss",
    "networkx",
    "newspaper",
    "nibabel",
    "nltk",
    "numpy",
    "pandas",
    "pillow",
    "playwright",
    "projects",
    "psd_tools",
    "psutil",
    "pyautogui",
    "pydantic",
    "pydantic_settings",
    "pydicom",
    "pyedflib",
    "pymzml",
    "pynvml",
    "pypdf",
    "pysam",
    "pyteomics",
    "pytesseract",
    "python-docx",
    "python-magic",
    "pyyaml",
    "rasterio",
    "ratelimit",
    "rdkit",
    "requests",
    "schemas",
    "scikit-learn",
    "scipy",
    "selenium",
    "sentence_transformers",
    "spacy",
    "src",
    "textstat",
    "toml",
    "torch",
    "trimesh",
    "warcio",
    "xarray",
]

[project.scripts]
vm-lab = "somnus_vm.cli:main"
somnus-guest-bootstrap = "somnus_vm.guest.bootstrap:main"
somnus-vm-daemon = "somnus_vm.daemon_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
